# Townhouse — Docker Compose with profiles (Story 21.2)
#
# Alternative to the DockerOrchestrator for operators who prefer compose.
# Both approaches produce identical container configurations.
#
# Usage:
#   docker compose -f docker-compose-townhouse.yml up                    # connector only
#   docker compose -f docker-compose-townhouse.yml --profile town up     # connector + town
#   docker compose -f docker-compose-townhouse.yml --profile town --profile mill up
#   docker compose -f docker-compose-townhouse.yml --profile town --profile mill --profile dvm up

networks:
  townhouse-net:
    driver: bridge

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Connector — always runs (no profile restriction)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  connector:
    image: ghcr.io/toon-protocol/connector:latest
    container_name: townhouse-connector
    networks:
      - townhouse-net
    ports:
      - '127.0.0.1:9401:9401'
    environment:
      CONNECTOR_ADMIN_PORT: '9401'
      CONNECTOR_ILP_ADDRESS: g.townhouse
      # CONNECTOR_PEERS is overridden at runtime by the orchestrator.
      # Default value includes all three node types for compose-only usage.
      # nosemgrep: javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket -- Docker-internal BTP URLs, TLS unnecessary
      CONNECTOR_PEERS: '[{"id":"town","relation":"child","btpUrl":"btp+ws://townhouse-town:3000","assetCode":"USD","assetScale":6},{"id":"mill","relation":"child","btpUrl":"btp+ws://townhouse-mill:3000","assetCode":"USD","assetScale":6},{"id":"dvm","relation":"child","btpUrl":"btp+ws://townhouse-dvm:3000","assetCode":"USD","assetScale":6}]'
      TRANSPORT_MODE: direct
    restart: unless-stopped
    healthcheck:
      # nosemgrep: trailofbits.generic.wget-unencrypted-url.wget-unencrypted-url -- container-internal health probe, TLS unnecessary
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9401/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Town — Nostr relay node (profile: town)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  town:
    image: toon:town
    container_name: townhouse-town
    profiles:
      - town
    networks:
      - townhouse-net
    depends_on:
      connector:
        condition: service_healthy
    # BTP port 3000 exposed for connector peer communication (Docker-internal only)
    expose:
      - '3000'
    ports:
      - '127.0.0.1:7100:7100'
      - '127.0.0.1:3100:3100'
    environment:
      # nosemgrep: detect-insecure-websocket -- Docker-internal, TLS unnecessary
      CONNECTOR_URL: ws://townhouse-connector:3000
      FEE_PER_EVENT: '0'
      # Identity env vars (injected by orchestrator at runtime)
      NODE_NOSTR_PUBKEY: ''
      NODE_EVM_ADDRESS: ''
      NODE_NOSTR_SECRET_KEY: ''
    volumes:
      - townhouse-town-data:/data
    healthcheck:
      # nosemgrep: trailofbits.generic.wget-unencrypted-url.wget-unencrypted-url -- container-internal health probe, TLS unnecessary
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3100/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Mill — multi-chain swap node (profile: mill)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  mill:
    image: toon:mill
    container_name: townhouse-mill
    profiles:
      - mill
    networks:
      - townhouse-net
    depends_on:
      connector:
        condition: service_healthy
    # BTP port 3000 exposed for connector peer communication (Docker-internal only)
    expose:
      - '3000'
    environment:
      # nosemgrep: detect-insecure-websocket -- Docker-internal, TLS unnecessary
      CONNECTOR_URL: ws://townhouse-connector:3000
      FEE_BASIS_POINTS: '0'
    restart: unless-stopped

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DVM — compute/data vending machine (profile: dvm)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  dvm:
    image: toon:dvm
    container_name: townhouse-dvm
    profiles:
      - dvm
    networks:
      - townhouse-net
    depends_on:
      connector:
        condition: service_healthy
    # BTP port 3000 exposed for connector peer communication (Docker-internal only)
    expose:
      - '3000'
    environment:
      # nosemgrep: detect-insecure-websocket -- Docker-internal, TLS unnecessary
      CONNECTOR_URL: ws://townhouse-connector:3000
      FEE_PER_JOB: '0'
    restart: unless-stopped

volumes:
  townhouse-town-data:
