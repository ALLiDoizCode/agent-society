---
# Townhouse-on-Akash — full operator stack as a hidden service.
#
# Architecture (matches docker-compose-townhouse-hs.yml — Phase 4 sidecar):
#
#     external peer
#       │ wss://<addr>.anyone/btp           (Anyone Protocol)
#       ▼
#     ator-sidecar service   (runs anon directly with hand-written torrc)
#       │ HiddenServiceDir /var/lib/anon/hs   (seeded from HS_SECRET_KEY_B64)
#       │ HiddenServicePort 3000 connector:3000
#       │ SOCKSPort 0.0.0.0:9050             (outbound proxy for connector)
#       ▼
#     apex connector service
#       │ transport.socksProxy=socks5h://ator-sidecar:9050
#       │ transport.externalUrl=wss://<addr>.anyone/btp   (rendered into YAML)
#       │ transport.managed=false   (no in-process anon — broken in SDK v1.1.3)
#       ▼
#     town + mill + dvm   (apex dials btp+ws://<svc>:3000 over Akash service-DNS)
#
# Why a sidecar: the apex connector image at 3.3.3 has wiring for managed=true
# (in-process anon) but the underlying @anyone-protocol/anyone-client@1.1.3
# ignores HS opts and never publishes a hidden service. The sidecar runs the
# anon binary directly with a torrc that has the HS directives, bypassing the
# SDK gap. Validated end-to-end on the laptop compose (Phase 4).
#
# Chain devnets are SEPARATE Akash deployments per the operator's earlier
# directive. The mill service reads anvil+solana RPC URLs from
# `deploy/akash/leases.json` at deploy time — see scripts/akash-deploy.sh's
# render_townhouse_sdl for the substitution logic.
#
# Phase 1 lessons baked in:
#   1. NO L7 ingress (`as: 80`) — TCP forwarding only.
#   2. NO persistent storage. The `.anyone` keypair is injected as
#      HS_SECRET_KEY_B64 (env), so redeploys keep the same address.
#   3. Run as root in containers — some providers' Pod Security Policies
#      reject non-root images.
#
# Template tokens substituted by scripts/akash-deploy.sh render_townhouse_sdl:
#   __CONNECTOR_CONFIG_YAML_B64__  - rendered connector.yaml with externalUrl
#                                    already substituted in (base64)
#   __HS_SECRET_KEY_B64__          - pre-generated v3 keypair secret (base64).
#                                    Now goes ONLY to the sidecar — the
#                                    connector no longer needs it.
#   __EVM_RPC_URL__                - chain endpoint (default: anvil lease URL)
#   __EVM_CHAIN_ID__               - chain id (default: 31337 for anvil-on-Akash)
#   __EVM_USDC_ADDRESS__           - Mock USDC contract (default baked into akash-anvil)
#   __SOLANA_RPC_URL__             - chain endpoint (default: solana lease URL)
#   __SOLANA_USDC_MINT__           - Mock USDC mint (default baked into akash-solana)
#
# After deploy, the .anyone hostname is known up-front (we generated the
# keypair locally), so leases.json captures it directly.

version: "2.0"

services:
  # ── ATOR sidecar — publishes the .anyone HS, forwards to connector:3000 ──
  #
  # Sibling of the apex connector. Runs `anon` directly (NOT via the SDK)
  # with a hand-written torrc. The HiddenServicePort directive forwards
  # inbound HS traffic to the connector via Akash service-DNS. Also exposes
  # SOCKSPort 9050 on 0.0.0.0 so the connector container can dial it for
  # outbound BTP via socks5h://ator-sidecar:9050.
  #
  # No expose block — the sidecar is internal-only on the deployment network.
  # The `.anyone` HS is the operational surface; SOCKS is a sibling-only proxy.
  ator-sidecar:
    image: ghcr.io/toon-protocol/townhouse-ator-sidecar:demo
    env:
      - HS_SECRET_KEY_B64=__HS_SECRET_KEY_B64__
      - HS_PORT=3000
      # Akash service-DNS: the apex connector service is reachable as
      # `connector` on the deployment network. The sidecar's entrypoint
      # resolves this hostname to an IP at startup (anon's HiddenServicePort
      # directive doesn't accept hostnames — only IP:port).
      - HS_TARGET_HOST=connector
      - HS_TARGET_PORT=3000
      - SOCKS_PORT=9050
      - NICKNAME=townhouse-hs

  # ── Apex connector — terminates inbound BTP from the .anyone HS ──────────
  #
  # The connector now runs its image's CMD as-is (modulo a small wrapper to
  # decode the YAML config from CONNECTOR_CONFIG_YAML_B64 onto disk). All
  # the keypair injection that lived here previously has moved to the
  # sidecar. The connector treats the sidecar as an external SOCKS5 proxy
  # (managed=false in the YAML) and uses an explicit externalUrl that was
  # rendered into the YAML before base64-encoding.
  connector:
    image: ghcr.io/toon-protocol/connector:3.4.0
    env:
      - CONFIG_FILE=/config/connector.yaml
      - CONNECTOR_ADMIN_PORT=9401
      - CONNECTOR_ILP_ADDRESS=g.townhouse
      - CONNECTOR_CONFIG_YAML_B64=__CONNECTOR_CONFIG_YAML_B64__
      - |
        CONNECTOR_PEERS=[{"id":"town","relation":"child","btpUrl":"btp+ws://town:3000","assetCode":"USD","assetScale":6},{"id":"mill","relation":"child","btpUrl":"btp+ws://mill:3000","assetCode":"USD","assetScale":6},{"id":"dvm","relation":"child","httpUrl":"http://dvm:3300","assetCode":"USD","assetScale":6}]
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /config
        printf '%s' "$$CONNECTOR_CONFIG_YAML_B64" | base64 -d > /config/connector.yaml
        # The connector's SocksTransportProvider does a SOCKS5 reachability
        # probe at startup with START_PROBE_TIMEOUT_MS=2000 (hardcoded in
        # the image). That's too short for cross-pod cold-start on Akash
        # where the sidecar takes 30-180s to bootstrap anon. Wait here
        # until the sidecar's SOCKS port is reachable, THEN start.
        echo "[connector-wait] probing ator-sidecar:9050..."
        until node -e "require('net').createConnection(9050,'ator-sidecar').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" 2>/dev/null; do
          echo "[connector-wait] sidecar SOCKS not reachable, retry in 5s"
          sleep 5
        done
        echo "[connector-wait] sidecar SOCKS reachable; starting connector"
        exec node packages/connector/dist/main.js
    # No `expose:` — the .anyone HS is the operational access path. The
    # SDL's "one global service" validator requirement is satisfied by the
    # faucet service's exposed HTTP port (see below).

  # ── Town — Nostr relay child node ─────────────────────────────────────────
  #
  # Dev identity baked in (matches scripts/townhouse-dev-infra.sh's
  # TOWN_01_SECRET_KEY). DEV ONLY — production deployments would generate
  # per-instance keys and inject via the deploy script.
  town:
    image: ghcr.io/toon-protocol/townhouse-town:demo
    env:
      - BTP_SERVER_PORT=3000
      - FEE_PER_EVENT=0
      - CONNECTOR_URL=ws://connector:3000
      - NODE_NOSTR_PUBKEY=
      - NODE_EVM_ADDRESS=
      - NODE_NOSTR_SECRET_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa01

  # ── Mill — multi-chain swap node, needs chain RPCs ────────────────────────
  #
  # Dev identity + mill config baked in. The MILL_CONFIG_JSON env carries
  # the full mill config (swapPairs/channels/inventory/relayUrls) inline —
  # mirrors docker/dev-fixtures/townhouse-hs-mill.config.json but with
  # relayUrls pointing at Akash service-DNS (`ws://town:7100`).
  mill:
    image: ghcr.io/toon-protocol/townhouse-mill:demo
    env:
      - BTP_SERVER_PORT=3000
      - FEE_BASIS_POINTS=0
      - CONNECTOR_URL=ws://connector:3000
      # Chain endpoints — substituted by render_townhouse_sdl from
      # .env.townhouse-hs or falls back to leases.json.
      - SETTLEMENT_RPC_URL=__EVM_RPC_URL__
      - SETTLEMENT_CHAIN_ID=__EVM_CHAIN_ID__
      - SETTLEMENT_TOKEN_ADDRESS=__EVM_USDC_ADDRESS__
      - SOLANA_RPC_URL=__SOLANA_RPC_URL__
      - SOLANA_USDC_MINT=__SOLANA_USDC_MINT__
      # Dev BIP-39 mnemonic (test vector zero). DEV ONLY.
      - MILL_MNEMONIC=abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about
      - NODE_NOSTR_PUBKEY=
      - NODE_EVM_ADDRESS=
      - NODE_NOSTR_SECRET_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa03
      # Mill operational config — inline JSON via YAML block scalar so the
      # mill entrypoint reads it without needing a mounted file (Akash
      # doesn't support host bind mounts).
      - |
        MILL_CONFIG_JSON={"swapPairs":[{"from":{"assetCode":"USDC","assetScale":6,"chain":"evm:base:31337"},"to":{"assetCode":"USDC","assetScale":6,"chain":"solana:devnet"},"rate":"1.0","minAmount":"1000","maxAmount":"1000000000"}],"chains":["evm","solana"],"channels":{"evm:base:31337":[{"channelId":"hs-mill-evm-ch1","cumulativeAmount":1000000,"nonce":1,"updatedAt":0}],"solana:devnet":[{"channelId":"hs-mill-sol-ch1","cumulativeAmount":1000000,"nonce":1,"updatedAt":0}]},"inventory":{"evm:base:31337":10000000,"solana:devnet":10000000},"relayUrls":["ws://town:7100"]}

  # ── DVM — Arweave upload data-vending-machine child node ─────────────────
  dvm:
    image: ghcr.io/toon-protocol/townhouse-dvm:demo
    env:
      - BTP_SERVER_PORT=3300
      - FEE_PER_JOB=0
      - DVM_KIND=5094
      - CONNECTOR_URL=ws://connector:3000
      - NODE_NOSTR_PUBKEY=
      - NODE_EVM_ADDRESS=
      - NODE_NOSTR_SECRET_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa05
      # Free-tier ArDrive Turbo (<100 KiB) requires no auth. Set TURBO_TOKEN
      # only when paid uploads are required.
      - TURBO_TOKEN=

  # ── Faucet — EVM ETH + Mock USDC drips, also satisfies the SDL's "one ────
  #    global service" validator requirement (Phase 1 lesson)
  #
  # SECURITY: the faucet uses well-known Anvil dev keys. For an Akash devnet
  # preview that's fine — Mock USDC has no real value. For real
  # testnets/mainnets, omit this service from the deployment entirely.
  # ─────────────────────────────────────────────────────────────────────────
  faucet:
    image: ghcr.io/toon-protocol/townhouse-faucet:demo
    env:
      - PORT=3500
      # ── EVM ──
      - RPC_URL=__EVM_RPC_URL__
      - TOKEN_ADDRESS=__EVM_USDC_ADDRESS__
      - ETH_AMOUNT=100
      - TOKEN_AMOUNT=10000
      # ── Solana ──
      # The Mock USDC mint pubkey is baked into the akash-solana image
      # (matches docker-compose-townhouse-hs.yml). Faucet authority keypair
      # is BAKED INTO the townhouse-faucet image at /etc/faucet/sol-authority.json
      # — same security posture as the well-known Anvil account[0].
      - SOLANA_RPC_URL=__SOLANA_RPC_URL__
      - SOLANA_USDC_MINT=__SOLANA_USDC_MINT__
      - SOLANA_FAUCET_AUTHORITY_KEYPAIR_PATH=/etc/faucet/sol-authority.json
      - SOL_USDC_AMOUNT=100
      - RATE_LIMIT_HOURS=1
    expose:
      # The faucet's HTTP UI is the lease's global service. TCP forwarding
      # (no `as: 80`) avoids the Phase 1 nginx-routing trap.
      - port: 3500
        proto: tcp
        to:
          - global: true

profiles:
  compute:
    ator-sidecar:
      # anon's network bootstrap is light when only running a hidden service
      # (no relay traffic). 0.25 CPU / 256 Mi is comfortable.
      resources:
        cpu:
          units: 0.25
        memory:
          size: 256Mi
        storage:
          - size: 512Mi
    connector:
      # Connector now does NOT spawn anon — it just runs the Node service.
      # 0.5 CPU / 512 Mi is plenty (no microdescriptor RAM pressure anymore).
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          - size: 1Gi
    town:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          - size: 2Gi
    mill:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          - size: 1Gi
    dvm:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          - size: 1Gi
    faucet:
      resources:
        cpu:
          units: 0.25
        memory:
          size: 256Mi
        storage:
          - size: 512Mi
  placement:
    dcloud:
      pricing:
        ator-sidecar:
          denom: uakt
          amount: 1000
        connector:
          denom: uakt
          amount: 2000
        town:
          denom: uakt
          amount: 1500
        mill:
          denom: uakt
          amount: 1500
        dvm:
          denom: uakt
          amount: 1500
        faucet:
          denom: uakt
          amount: 1000

deployment:
  ator-sidecar:
    dcloud:
      profile: ator-sidecar
      count: 1
  connector:
    dcloud:
      profile: connector
      count: 1
  town:
    dcloud:
      profile: town
      count: 1
  mill:
    dcloud:
      profile: mill
      count: 1
  dvm:
    dcloud:
      profile: dvm
      count: 1
  faucet:
    dcloud:
      profile: faucet
      count: 1
