# TOON Test Pipeline
# Stack: backend (Node.js monorepo) | Framework: Vitest
# Philosophy: No mocks — real crypto, real TOON codec, real local infra
#
# Triggers:
#   PR / push to main or development  → lint, build, unit tests, format check
#   Nightly (2 AM UTC)                → full suite including E2E (requires genesis node)
#   Manual dispatch                   → selectable test level

name: Test Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    # Nightly E2E at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level to run'
        required: false
        default: 'all'
        type: choice
        options:
          - unit
          - integration
          - e2e
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────
  # Stage 1: Lint + Build + Format (required for all tests)
  # ─────────────────────────────────────────────
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build all packages
        run: pnpm -r --filter '!@toon-protocol/memvid-node' build

      - name: Cache build artifacts
        uses: actions/cache/save@v4
        with:
          path: |
            packages/*/dist
            node_modules
            packages/*/node_modules
          key: build-${{ github.sha }}

  # ─────────────────────────────────────────────
  # Stage 2: Unit Tests (fast, every PR)
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-build
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.test_level == 'unit' ||
      github.event.inputs.test_level == 'all'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/dist
            node_modules
            packages/*/node_modules
          key: build-${{ github.sha }}

      - name: Run unit tests (vitest)
        run: pnpm test -- --run --reporter=verbose

      - name: Run unit tests (pet-dvm Jest)
        run: pnpm test:jest

      - name: Run skill structural tests
        # Non-blocking burn-in: 3 of 10 skill tests have pre-existing failures
        # from batch-produced skills (Epic 9). Surfaced as warnings until fixed.
        # See Epic 9 retro A1 and A5 for context.
        continue-on-error: true
        run: |
          echo "Running skill structural validation tests..."
          PASSED=0
          FAILED=0
          FAILED_SCRIPTS=""
          for test_script in tests/skills/test-*-skill.sh; do
            echo "── $test_script ──"
            if bash "$test_script"; then
              echo "✓ PASS: $test_script"
              PASSED=$((PASSED + 1))
            else
              echo "✗ FAIL: $test_script"
              FAILED=$((FAILED + 1))
              FAILED_SCRIPTS="$FAILED_SCRIPTS $test_script"
            fi
          done
          echo ""
          echo "=== Skill Structural Tests: $PASSED passed, $FAILED failed ==="
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED skill structural test(s) failed:$FAILED_SCRIPTS"
            exit 1
          fi
          echo "All skill structural tests passed."

      - name: Run unit tests with coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: pnpm test:coverage -- --run --reporter=json --outputFile=coverage-report.json

      - name: Upload coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-report.json
          retention-days: 14

  # ─────────────────────────────────────────────
  # Stage 2c: Connector Contract Canary (every PR)
  # Lightweight smoke test against @toon-protocol/connector public API.
  # Fails fast (<60s) when the connector breaks its API contract, before
  # the heavy E2E matrix runs. See packages/sdk/CONNECTOR_MIGRATION.md.
  # Story 22.5.
  #
  # Action references in THIS job are pinned to full commit SHAs per
  # OWASP A08 (Software & Data Integrity Failures). Other jobs in this
  # file use floating @v4 tags — pinning the rest is out of scope here.
  # ─────────────────────────────────────────────
  connector-contract-canary:
    name: Connector Contract Canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Intentionally no `cache: 'pnpm'` — this job relies on the
          # `build-${{ github.sha }}` cache below for node_modules. On a
          # build-cache hit we skip `pnpm install`, so pnpm's store directory
          # never gets populated and the setup-node post-step would error
          # ("Path Validation Error") trying to save a nonexistent path.

      - name: Restore build artifacts
        id: build-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            packages/*/dist
            node_modules
            packages/*/node_modules
          key: build-${{ github.sha }}

      # Fallback when the build cache misses (eviction / re-run after a
      # transient lint-and-build failure). Without this, vitest would fail
      # with module-resolution errors that mimic a real contract regression.
      - name: Install dependencies (cache miss fallback)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build sdk + deps (cache miss fallback)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @toon-protocol/sdk... build

      # Type-level guards in the canary (e.g. `@ts-expect-error` on
      # `ConnectorConfig['settlementInfra']`) are stripped by vitest's
      # esbuild transform. Run `tsc --noEmit` over the test file so those
      # guards fail the canary at compile time, not just at vitest runtime.
      - name: Type-check connector contract canary
        working-directory: packages/sdk
        run: pnpm exec tsc --noEmit --project tests/integration/tsconfig.json

      - name: Run connector contract canary
        working-directory: packages/sdk
        run: pnpm test:integration -- tests/integration/connector-contract.test.ts --reporter=verbose

  # ─────────────────────────────────────────────
  # Stage 2b: Security Audit (every PR)
  # ─────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: lint-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --prod || true
        # Non-blocking: transitive deps in @ardrive/turbo-sdk and
        # @toon-protocol/connector have known vulnerabilities with no
        # available patches. Logged for visibility; see .pnpmauditrc
        # for acknowledged vulnerabilities.

  # ─────────────────────────────────────────────
  # Stage 3: Integration Tests
  # Runs on nightly, manual dispatch, or when explicitly requested
  # ─────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-build, connector-contract-canary]
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.test_level == 'integration' ||
        github.event.inputs.test_level == 'all'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/dist
            node_modules
            packages/*/node_modules
          key: build-${{ github.sha }}

      - name: Run integration tests (root)
        run: pnpm vitest run --config vitest.integration.config.ts --reporter=verbose

      - name: Run integration tests (core)
        run: pnpm --filter @toon-protocol/core vitest run --config vitest.integration.config.ts --reporter=verbose

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-artifacts
          path: |
            packages/*/test-results/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Stage 4: E2E Tests (nightly or manual only)
  # Requires genesis node infrastructure
  # Uses real local infra: Anvil, relay, connector
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-build, connector-contract-canary]
    # Only run on nightly schedule or manual dispatch (requires genesis infrastructure)
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.test_level == 'e2e' ||
        github.event.inputs.test_level == 'all'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/dist
            node_modules
            packages/*/node_modules
          key: build-${{ github.sha }}

      - name: Start SDK E2E infrastructure
        run: ./scripts/sdk-e2e-infra.sh up
        env:
          CI: true

      - name: Run SDK E2E tests
        working-directory: packages/sdk
        run: pnpm test:e2e:docker -- --reporter=verbose
        env:
          CI: true

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            packages/*/test-results/
          retention-days: 7

      - name: Collect service logs on failure
        if: failure()
        run: |
          docker compose -p toon-sdk-e2e -f docker-compose-sdk-e2e.yml logs > sdk-e2e-logs.txt 2>&1 || true

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: sdk-e2e-logs.txt
          retention-days: 7

      - name: Tear down E2E infrastructure
        if: always()
        run: ./scripts/sdk-e2e-infra.sh down

  # ─────────────────────────────────────────────
  # Report: Aggregate results
  # ─────────────────────────────────────────────
  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, security-audit]
    if: always() && (github.event_name == 'pull_request')

    steps:
      - name: Generate summary
        run: |
          echo "## Test Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
