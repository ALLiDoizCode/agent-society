name: E2E Real HS Gate (49.5)

# NFR6: This gate runs real .anyone transport + real Akash chains.
# NEVER add on: push or on: pull_request — see story 49.5 AC #8 + NFR6.
on:
  workflow_dispatch:

env:
  # Required: Akash providers ship self-signed TLS certs (49.3 precedent).
  # Scoped to this workflow only — not a general policy.
  NODE_TLS_REJECT_UNAUTHORIZED: '0'

jobs:
  e2e-real-hs:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@8.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build townhouse
        run: pnpm --filter @toon-protocol/townhouse build

      - name: Bring up local-HS infra
        run: bash scripts/townhouse-e2e-local-hs.sh up

      - name: Run 49.5 gate
        run: bash scripts/townhouse-e2e-real-hs.sh

      - name: Tear down infra
        if: always()
        run: bash scripts/townhouse-e2e-local-hs.sh down-v
