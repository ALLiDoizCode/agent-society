# memvid-node Native Addon CI
# Builds and tests @toon-protocol/memvid-node on linux-x64 and darwin-arm64.
# Quality gate G1 (AC-15): both platforms must pass.

name: memvid-node CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/memvid-node/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/memvid-node/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # memvid-core is a local path dependency (not on crates.io).
      # Cargo.toml references path = "../../../memvid" (relative to
      # packages/memvid-node/), which resolves to a sibling directory
      # of the workspace root. Checking out to ../memvid is required
      # for cargo to locate the crate at build time.
      - uses: actions/checkout@v4
        with:
          repository: memvid/memvid
          path: ../memvid

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@8.15.0 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build native addon
        working-directory: packages/memvid-node
        run: pnpm build

      - name: Run tests
        working-directory: packages/memvid-node
        run: pnpm test
