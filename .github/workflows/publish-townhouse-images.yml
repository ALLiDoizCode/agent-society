# Publish Townhouse Images to GHCR (multi-arch + cosign keyless OIDC)
#
# Trigger scenarios and expected behaviour:
#   - Push of tag v*           → builds 4 townhouse images (townhouse-api, town, mill, dvm),
#                                 pushes versioned + :latest tags, signs, writes manifest,
#                                 renders compose templates, then npm-publishes @toon-protocol/townhouse.
#   - workflow_dispatch        → builds + pushes versioned tag only (NO :latest), signs,
#                                 writes manifest, renders templates (dry-run only; NO npm-publish).
#
# Connector image is NOT built or pushed here — it is published upstream by
# toon-protocol/connector's own workflow (Stories 44.2/44.3). Townhouse consumes
# it by digest via image-manifest.json. Republishing it here would create two
# cosign signatures from different OIDC identities and risk tag namespace
# collision on ghcr.io/toon-protocol/connector:latest. See Dev Notes §"Why
# EXACTLY four images".
#
# Cosign verify (post-publish runbook):
#   for img in townhouse-api town mill dvm; do
#     digest=$(docker buildx imagetools inspect ghcr.io/toon-protocol/$img:latest \
#       --format '{{.Manifest.Digest}}')
#     cosign verify ghcr.io/toon-protocol/$img@$digest \
#       --certificate-identity-regexp '^https://github.com/toon-protocol/town/' \
#       --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
#   done
#
# Staged delivery history:
#   v0.1.0 (Story 45.1): images + signatures + manifest published; npm publish in --dry-run
#     pending Story 45.2 (tarball must ship compose templates + manifest before live publish).
#   v0.1.0+ (Story 45.2): live npm publish flipped on; tarball ships
#     dist/compose/{townhouse-hs,townhouse-dev}.yml + dist/image-manifest.json.
#     Build sequence in npm-publish job: pnpm build → download-artifact (manifest)
#     → render-compose-template → verify tarball → pnpm publish (live).

name: Publish Townhouse Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for images (e.g. 0.1.0-rc1). Required for workflow_dispatch.'
        required: true
        type: string
      connector_version:
        description: 'Connector image tag to record in image-manifest.json (default: 3.4.1 = digest pinned in DEFAULT_CONNECTOR_IMAGE)'
        required: false
        type: string
        default: '3.4.1'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  # cancel-in-progress: false — never abort an in-flight publish that may already be signing images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write  # required for cosign keyless OIDC token

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: build-publish-sign (matrix across 4 townhouse-owned images)
  # ---------------------------------------------------------------------------
  build-publish-sign:
    runs-on: ubuntu-latest
    # arm64 QEMU emulation of the Solana dep chain takes 5.5-6 hrs on cold cache;
    # extend beyond the 6hr GHA default to accommodate first-run cold-cache builds.
    timeout-minutes: 420
    strategy:
      matrix:
        image: [townhouse-api, town, mill, dvm]
      # fail-fast: false — one image's transient sigstore flake should not abort the others
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up QEMU (cross-arch emulation for linux/arm64 on amd64 runners)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/toon-protocol/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
            type=match,pattern=v(.*),group=1
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,prefix=sha-

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3.9.1

      - name: Sign image digest via keyless OIDC
        # Sign the immutable content digest, NOT the tag (tags are mutable —
        # re-pointing a tag invalidates the signature binding to the old content).
        # The id-token: write permission granted at job level supplies the OIDC token.
        env:
          COSIGN_YES: 'true'
        run: |
          cosign sign \
            ghcr.io/toon-protocol/${{ matrix.image }}@${{ steps.build.outputs.digest }}

      - name: Verify multi-arch manifest (amd64 + arm64 both present)
        # Use docker buildx imagetools inspect with the digest-form ref — more
        # reliable than docker manifest inspect under parallel publishes because
        # tag → digest resolution is racy during concurrent matrix jobs.
        run: |
          docker buildx imagetools inspect \
            ghcr.io/toon-protocol/${{ matrix.image }}@${{ steps.build.outputs.digest }} \
            --format '{{json .Manifest}}' \
            | jq -e '.manifests | map(.platform.architecture) | sort | contains(["amd64", "arm64"])' \
            || { echo "FAIL: ${{ matrix.image }} missing amd64 or arm64 in manifest list"; exit 1; }

      - name: Write digest file for artifact upload
        run: |
          echo "${{ steps.build.outputs.digest }}" > /tmp/digest-${{ matrix.image }}.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: digest-${{ matrix.image }}
          path: /tmp/digest-${{ matrix.image }}.txt
          if-no-files-found: error
          overwrite: true

  # ---------------------------------------------------------------------------
  # Job 2: build-image-manifest (collect digests → write manifest.json)
  # ---------------------------------------------------------------------------
  build-image-manifest:
    runs-on: ubuntu-latest
    needs: [build-publish-sign]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Download digest artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: digest-*
          merge-multiple: false
          path: /tmp/digests

      - name: Log in to GHCR (needed for docker manifest inspect to resolve connector digest)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version string
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build image-manifest.json
        run: |
          set -euo pipefail
          TOWNHOUSE_API_DIGEST=$(cat /tmp/digests/digest-townhouse-api/digest-townhouse-api.txt)
          TOWN_DIGEST=$(cat /tmp/digests/digest-town/digest-town.txt)
          MILL_DIGEST=$(cat /tmp/digests/digest-mill/digest-mill.txt)
          DVM_DIGEST=$(cat /tmp/digests/digest-dvm/digest-dvm.txt)

          # Resolve connector digest via buildx imagetools (handles OCI image index
          # correctly — docker manifest inspect doesn't expose the index digest directly)
          CONNECTOR_TAG="${{ inputs.connector_version || '3.4.1' }}"
          CONNECTOR_DIGEST=$(docker buildx imagetools inspect \
            "ghcr.io/toon-protocol/connector:${CONNECTOR_TAG}" \
            --format '{{.Manifest.Digest}}')

          # Install zod for manifest schema validation (used by the script)
          npm install --no-save zod@3

          node scripts/build-image-manifest.mjs \
            --townhouse-version "${{ steps.version.outputs.version }}" \
            --connector-tag "${CONNECTOR_TAG}" \
            --connector-digest "${CONNECTOR_DIGEST}" \
            --townhouse-api-digest "$TOWNHOUSE_API_DIGEST" \
            --town-digest "$TOWN_DIGEST" \
            --mill-digest "$MILL_DIGEST" \
            --dvm-digest "$DVM_DIGEST"

      - name: Upload image-manifest.json artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: image-manifest
          path: packages/townhouse/dist/image-manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 3: publish-npm (gated: tag pushes only, after all images signed)
  # ---------------------------------------------------------------------------
  publish-npm:
    runs-on: ubuntu-latest
    needs: [build-publish-sign, build-image-manifest]
    # Only npm-publish on real v* tag pushes — never on workflow_dispatch smoke runs
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 8.15.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @toon-protocol/townhouse (and workspace dependencies)
        # `--filter @toon-protocol/townhouse...` (trailing `...`) builds
        # townhouse AND its workspace deps (core, bls, sdk, mill) — required
        # because tsup's `dts: true` step resolves `@toon-protocol/mill` etc.
        # from `wallet/manager.ts` and needs each dep's dist/ + types present.
        # Without `...`, mill's dist/ is missing and `tsup` errors with
        # `TS2307: Cannot find module '@toon-protocol/mill'`.
        # clean: true in tsup config wipes dist/ at build start.
        # The manifest must be placed AFTER this build step, not before.
        run: pnpm --filter "@toon-protocol/townhouse..." build

      - name: Download image-manifest.json
        # Placed into dist/ AFTER pnpm build so tsup's clean: true doesn't wipe it.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: image-manifest
          path: packages/townhouse/dist

      - name: Render HS compose template against pinned digests
        # Re-runs the placeholder substitution now that dist/image-manifest.json
        # is present. tsup's onSuccess hook ran without the manifest (clean build),
        # so this step produces the authoritative digest-substituted HS template.
        run: node scripts/render-compose-template.mjs

      - name: Verify tarball contents
        # Gate: ensure the three required artifacts are present in the tarball
        # and the HS YAML has no unsubstituted placeholders before publishing.
        run: |
          set -euo pipefail
          PACK_OUT=$(mktemp -d)
          PACK_EXTRACT=$(mktemp -d)
          pnpm --filter @toon-protocol/townhouse pack --pack-destination "$PACK_OUT"
          # Globbing for the tgz is fine because $PACK_OUT is fresh from mktemp.
          TGZ=$(ls "$PACK_OUT"/toon-protocol-townhouse-*.tgz | head -1)
          [ -f "$TGZ" ] || { echo "FAIL: pnpm pack did not produce a tgz in $PACK_OUT"; exit 1; }
          tar -tzf "$TGZ" > "$PACK_OUT/listing.txt"
          for path in \
            package/dist/compose/townhouse-hs.yml \
            package/dist/compose/townhouse-dev.yml \
            package/dist/image-manifest.json; do
            # Anchor the match — a `*.bak` or partial-name file would otherwise
            # satisfy a substring grep without the actual file existing.
            grep -qE "^${path}\$" "$PACK_OUT/listing.txt" \
              || { echo "MISSING from tarball: $path"; exit 1; }
          done
          tar -xzf "$TGZ" -C "$PACK_EXTRACT"
          HS_YAML="$PACK_EXTRACT/package/dist/compose/townhouse-hs.yml"
          # Negative: no unsubstituted placeholders.
          if grep -E '\$\{TOON_[A-Z_]+_DIGEST\}' "$HS_YAML"; then
            echo "FAIL: unsubstituted placeholders in tarball HS YAML"; exit 1
          fi
          # Positive: every services.<name>.image must use full digest form.
          # Single regex enforces YAML shape ('  image: <ref>'), digest form
          # (@sha256:<64hex>), and tolerates trailing CR / whitespace. Catches
          # orphaned '@' (empty-digest substitution) and tag-form refs because
          # neither matches the strict 64-hex tail. The IMAGE_LINES floor stops
          # a structural refactor that drops all 'image:' keys from passing the
          # gate via 0===0.
          IMAGE_LINES=$(grep -cE '^[[:space:]]+image:[[:space:]]+' "$HS_YAML" || true)
          DIGEST_LINES=$(grep -cE '^[[:space:]]+image:[[:space:]]+[^[:space:]]+@sha256:[a-f0-9]{64}[[:space:]]*$' "$HS_YAML" || true)
          if [ "$IMAGE_LINES" -lt 1 ]; then
            echo "FAIL: no image: lines found in $HS_YAML — structural defect in template"; exit 1
          fi
          if [ "$IMAGE_LINES" -ne "$DIGEST_LINES" ]; then
            echo "FAIL: $IMAGE_LINES image: lines but only $DIGEST_LINES use @sha256:<64hex> digest form"
            exit 1
          fi
          echo "✅ Tarball contains all required artifacts with no unsubstituted placeholders ($DIGEST_LINES digest-pinned images)"

      - name: Publish to npm
        run: pnpm --filter @toon-protocol/townhouse publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
