<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOON Dev Faucet — Anvil + Solana</title>
    <style>
      :root {
        --bg: #f6f6f7;
        --surface: #ffffff;
        --border: #e0e0e3;
        --text: #1a1a1c;
        --muted: #6a6a72;
        --quiet: #8e8e95;
        --accent: #4f46e5;
        --accent-soft: #eef0ff;
        --ok: #1f7d3b;
        --ok-soft: #e6f5ec;
        --warn: #8a6200;
        --warn-soft: #fff4d6;
        --error: #b3261e;
        --error-soft: #fbe9e8;
        --mono:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 24px 16px;
        line-height: 1.5;
      }

      .wrap {
        max-width: 640px;
        margin: 0 auto;
      }

      header.hero {
        margin-bottom: 20px;
      }

      header.hero h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      header.hero p {
        color: var(--muted);
        font-size: 0.95rem;
        margin-top: 4px;
      }

      header.hero a {
        color: var(--accent);
        text-decoration: none;
      }

      header.hero a:hover {
        text-decoration: underline;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
      }

      .banner {
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 0.9rem;
        margin-bottom: 16px;
        display: none;
      }

      .banner.warn {
        background: var(--warn-soft);
        color: var(--warn);
        border: 1px solid #f0d27a;
      }

      .banner.warn.show {
        display: block;
      }

      .row {
        margin-bottom: 14px;
      }

      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 6px;
      }

      select,
      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font-size: 0.95rem;
        font-family: var(--mono);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      select {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      select:focus,
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      input:disabled {
        background: var(--bg);
        color: var(--muted);
      }

      .chain-badge {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--quiet);
        margin-top: 4px;
      }

      .detect {
        margin-top: 4px;
        font-size: 0.8rem;
        font-family: var(--mono);
      }

      .detect.ok {
        color: var(--ok);
      }

      .detect.bad {
        color: var(--error);
      }

      .help {
        font-size: 0.8rem;
        color: var(--quiet);
        margin-top: 4px;
        font-family: var(--mono);
      }

      button.primary {
        width: 100%;
        padding: 11px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: white;
        font-size: 0.95rem;
        font-weight: 500;
        border-radius: 6px;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.05s;
      }

      button.primary:hover:not(:disabled) {
        background: #4338ca;
      }

      button.primary:active:not(:disabled) {
        transform: translateY(1px);
      }

      button.primary:disabled {
        background: var(--quiet);
        border-color: var(--quiet);
        cursor: not-allowed;
      }

      .status {
        margin-top: 14px;
        padding: 10px 12px;
        background: var(--bg);
        border-radius: 6px;
        font-size: 0.9rem;
        font-family: var(--mono);
        color: var(--muted);
        min-height: 20px;
        word-break: break-all;
      }

      .status.error {
        background: var(--error-soft);
        color: var(--error);
      }

      .status.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }

      .status a {
        color: inherit;
        text-decoration: underline;
      }

      .recent {
        margin-top: 16px;
      }

      .recent h3 {
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--quiet);
        margin-bottom: 8px;
      }

      .recent-list {
        font-family: var(--mono);
        font-size: 0.85rem;
        max-height: 260px;
        overflow-y: auto;
      }

      .recent-list .row-item {
        display: flex;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
        color: var(--muted);
      }

      .recent-list .row-item:last-child {
        border-bottom: none;
      }

      .recent-list .tag {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 3px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .tag.evm {
        background: #eaf3ff;
        color: #1d5fbf;
      }

      .tag.sol {
        background: #f0eaff;
        color: #6c2ec5;
      }

      .empty {
        color: var(--quiet);
        font-style: italic;
        font-size: 0.85rem;
      }

      footer.meta {
        margin-top: 20px;
        font-size: 0.8rem;
        color: var(--quiet);
        text-align: center;
      }

      footer.meta a {
        color: var(--quiet);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <h1>TOON Dev Faucet — Anvil + Solana</h1>
        <p>
          Free tokens for testing publishes. Not real money. Resets on lease
          churn. <a href="https://github.com/toon-protocol/town" target="_blank" rel="noopener">repo ↗</a>
        </p>
      </header>

      <div id="downBanner" class="banner warn"></div>

      <div class="card">
        <div class="row">
          <label for="chain">Chain</label>
          <select id="chain" autocomplete="off">
            <option value="auto" selected>Auto</option>
            <option value="evm">EVM</option>
            <option value="solana">SOL</option>
          </select>
          <div id="chainBadge" class="chain-badge">—</div>
        </div>

        <div class="row">
          <label for="address">Address</label>
          <input
            type="text"
            id="address"
            placeholder="0x… or base58…"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="detect" class="detect">awaiting input</div>
        </div>

        <div class="row">
          <label for="amount">Amount</label>
          <input type="number" id="amount" min="1" step="1" placeholder="100" />
          <div class="help">USDC (+1 ETH or +1 SOL native gas)</div>
        </div>

        <button id="submit" class="primary" type="button" disabled>
          Drip me tokens
        </button>

        <div id="status" class="status">idle</div>
      </div>

      <div class="recent card">
        <h3>Recent drips</h3>
        <div id="recentList" class="recent-list">
          <div class="empty">no drips yet</div>
        </div>
      </div>

      <footer class="meta">
        TOON Local Development Faucet ·
        <a href="https://github.com/toon-protocol/town/tree/main/deploy/akash" target="_blank" rel="noopener">deploy docs ↗</a>
      </footer>
    </div>

    <script>
      const EVM_RE = /^0x[0-9a-fA-F]{40}$/;
      const SOL_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
      const CHAIN_BADGE = {
        evm: "Anvil · 31337",
        solana: "Solana devnet · local",
        auto: "—",
      };

      const $ = (id) => document.getElementById(id);
      const chainSel = $("chain");
      const chainBadge = $("chainBadge");
      const addrInput = $("address");
      const detect = $("detect");
      const amountInput = $("amount");
      const submitBtn = $("submit");
      const statusEl = $("status");
      const recentList = $("recentList");
      const downBanner = $("downBanner");

      let countdownTimer = null;
      let lastValidChain = null;

      function classifyAddress(addr) {
        if (!addr) return { chain: null, kind: "empty" };
        if (EVM_RE.test(addr)) return { chain: "evm", kind: "ok" };
        if (SOL_RE.test(addr)) return { chain: "solana", kind: "ok" };
        return { chain: null, kind: "bad" };
      }

      function renderDetect() {
        const addr = addrInput.value.trim();
        const { chain, kind } = classifyAddress(addr);
        const userChain = chainSel.value;

        if (kind === "empty") {
          detect.textContent = "awaiting input";
          detect.className = "detect";
          lastValidChain = null;
          submitBtn.disabled = true;
          if (userChain === "auto") {
            chainBadge.textContent = "—";
          } else {
            chainBadge.textContent = CHAIN_BADGE[userChain];
          }
          return;
        }

        if (kind === "bad") {
          detect.textContent = "invalid";
          detect.className = "detect bad";
          lastValidChain = null;
          submitBtn.disabled = true;
          return;
        }

        // Address looks valid for `chain`. If the user picked Auto, snap. If
        // they picked a specific chain that disagrees, show the mismatch as
        // invalid (their selection wins — they may know something we don't,
        // but we'd rather refuse than send a SOL drip to a 0x address).
        if (userChain === "auto") {
          lastValidChain = chain;
          chainBadge.textContent = CHAIN_BADGE[chain];
          detect.textContent = chain === "evm" ? "EVM ✓" : "SOL ✓";
          detect.className = "detect ok";
          submitBtn.disabled = false;
          return;
        }

        if (userChain === chain) {
          lastValidChain = chain;
          chainBadge.textContent = CHAIN_BADGE[chain];
          detect.textContent = chain === "evm" ? "EVM ✓" : "SOL ✓";
          detect.className = "detect ok";
          submitBtn.disabled = false;
        } else {
          lastValidChain = null;
          chainBadge.textContent = CHAIN_BADGE[userChain];
          detect.textContent = `mismatch — address looks like ${chain.toUpperCase()}, dropdown says ${userChain.toUpperCase()}`;
          detect.className = "detect bad";
          submitBtn.disabled = true;
        }
      }

      addrInput.addEventListener("input", renderDetect);
      chainSel.addEventListener("change", renderDetect);

      function setStatus(text, level) {
        statusEl.textContent = text;
        statusEl.className = `status${level ? " " + level : ""}`;
      }

      function setStatusHtml(html, level) {
        statusEl.innerHTML = html;
        statusEl.className = `status${level ? " " + level : ""}`;
      }

      async function pollHealth() {
        try {
          const r = await fetch("/health", { cache: "no-store" });
          if (!r.ok) {
            downBanner.textContent =
              "Faucet drained, operator notified, try again after the next lease cycle.";
            downBanner.classList.add("show");
            return;
          }
          const j = await r.json();
          if (j.solanaConfigured && !j.solanaAuthorityReady) {
            downBanner.textContent =
              "Solana faucet authority unavailable — USDC drip disabled. SOL airdrops still work.";
            downBanner.classList.add("show");
          } else if (!j.tokenReady && (!chainSel.value || chainSel.value === "evm" || chainSel.value === "auto")) {
            downBanner.textContent =
              "EVM token contract not yet deployed. Wait a moment and reload.";
            downBanner.classList.add("show");
          } else {
            downBanner.classList.remove("show");
          }
        } catch {
          downBanner.textContent =
            "Faucet unreachable — check your connection or try again in a moment.";
          downBanner.classList.add("show");
        }
      }

      function startRetryCountdown(seconds, baseMessage) {
        if (countdownTimer) clearInterval(countdownTimer);
        let remaining = seconds;
        submitBtn.disabled = true;
        const tick = () => {
          if (remaining <= 0) {
            clearInterval(countdownTimer);
            countdownTimer = null;
            renderDetect(); // re-enables submit if address is still valid
            setStatus("ready", null);
            return;
          }
          setStatus(`${baseMessage} — next drip in ${remaining}s`, "error");
          remaining -= 1;
        };
        tick();
        countdownTimer = setInterval(tick, 1000);
      }

      async function loadRecent() {
        try {
          const r = await fetch("/faucet/recent?limit=10", { cache: "no-store" });
          if (!r.ok) return;
          const items = await r.json();
          if (!Array.isArray(items) || items.length === 0) {
            recentList.innerHTML = '<div class="empty">no drips yet</div>';
            return;
          }
          recentList.innerHTML = items
            .map((d) => {
              const tag = d.chain === "evm" ? "EVM" : "SOL";
              const cls = d.chain === "evm" ? "evm" : "sol";
              const rel = relativeTime(d.ts);
              return `<div class="row-item"><span class="tag ${cls}">${tag}</span><span>${d.address}</span><span>← ${d.amount}</span><span>· ${rel}</span></div>`;
            })
            .join("");
        } catch {
          // Non-fatal — keep last-known render.
        }
      }

      function relativeTime(iso) {
        const then = new Date(iso).getTime();
        if (!Number.isFinite(then)) return iso;
        const diff = Math.max(0, Math.floor((Date.now() - then) / 1000));
        if (diff < 60) return `${diff}s ago`;
        if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
        return `${Math.floor(diff / 86400)}d ago`;
      }

      submitBtn.addEventListener("click", async () => {
        const addr = addrInput.value.trim();
        const { chain: detectedChain, kind } = classifyAddress(addr);
        if (kind !== "ok") return;
        const userChain = chainSel.value;
        const chain =
          userChain === "auto" ? detectedChain : userChain;
        if (!chain) return;

        const amountRaw = amountInput.value.trim();
        const amount = amountRaw ? Number(amountRaw) : undefined;

        submitBtn.disabled = true;
        setStatus("requesting…", null);

        try {
          const path = chain === "evm" ? "/faucet/evm" : "/faucet/sol";
          const body = { address: addr };
          if (typeof amount === "number" && !Number.isNaN(amount)) {
            body.amount = amount;
          }
          const r = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });

          if (r.status === 429) {
            const retryAfterHeader = Number(r.headers.get("Retry-After") || 0);
            const j = await r.json().catch(() => ({}));
            const retryFromBody = Number(j.waitMinutes ?? 0) * 60;
            const seconds = Math.max(retryAfterHeader, retryFromBody, 1);
            startRetryCountdown(seconds, j.error || "rate limit exceeded");
            return;
          }

          const data = await r.json().catch(() => ({}));

          if (!r.ok) {
            const msg = data.error || `error: HTTP ${r.status}`;
            if (data.airdropSig) {
              setStatusHtml(
                `${escapeHtml(msg)} — SOL airdrop landed: <code>${escapeHtml(data.airdropSig)}</code>`,
                "error"
              );
            } else {
              setStatus(`error: ${msg}`, "error");
            }
            renderDetect();
            return;
          }

          const txLine = data.tx ? `tx: ${escapeHtml(data.tx)}` : "ok";
          const balLine =
            data.balanceAfter !== undefined
              ? ` · balanceAfter: ${escapeHtml(String(data.balanceAfter))}`
              : "";
          // Only allow https:// URLs — prevents javascript: XSS via a
          // misconfigured EVM_EXPLORER_URL_BASE / SOL_EXPLORER_URL_BASE env.
          const safeExplorerUrl =
            typeof data.explorerUrl === "string" &&
            data.explorerUrl.startsWith("https://")
              ? data.explorerUrl
              : null;
          const explorer = safeExplorerUrl
            ? ` <a href="${escapeAttr(safeExplorerUrl)}" target="_blank" rel="noopener">view ↗</a>`
            : "";
          setStatusHtml(`sent! ${txLine}${explorer}${balLine}`, "ok");
          renderDetect();
          loadRecent();
        } catch (err) {
          setStatus(`error: ${err.message || err}`, "error");
          renderDetect();
        }
      });

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c]);
      }

      function escapeAttr(s) {
        return escapeHtml(s);
      }

      // Initial render + periodic refresh
      renderDetect();
      pollHealth();
      loadRecent();
      setInterval(pollHealth, 15000);
      setInterval(loadRecent, 10000);
    </script>
  </body>
</html>
